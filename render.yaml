services:
  - type: web
    name: asklearn-pilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: COOKIE_SECURE
        value: "true"
      - key: CLOUD_PILOT
        value: "true"
